name: check

# Runs the self-checks on Mac, Linux and Windows every Monday, and on every push.
# The TikTok step can't fail the run: GitHub's servers are sometimes blocked by
# TikTok. weekly.yml says when the pinned yt-dlp itself broke (RELEASING.md: refresh the lock).
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  # Manifests, skill and agent frontmatter, the shared contracts copy, the Kiro files under .kiro/. Linux only: nothing OS-specific.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Skills frontmatter
        run: python tests/check_plugins.py
      - name: The Kiro extension (manifest, script, local pages only)
        run: python tests/check_extension.py
      - name: MCP server protocol and the Kiro files under .kiro/
        run: |
          python plugins/kirocut/mcp/test_server.py
          python tests/sync_kiro.py --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools (the pinned set)
        run: python -m pip install --no-deps --require-hashes -r plugins/kirocut/requirements/requirements.lock
      # setup-ffmpeg has no Apple Silicon build (macOS runners are arm64), and its Linux download fails: apt there.
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Self-checks
        env:
          PYTHONUNBUFFERED: "1"   # a script that dies hard still shows what it printed
          PYTHONFAULTHANDLER: "1"
        run: python tests/run_demos.py
      - name: List a TikTok profile
        continue-on-error: true
        run: python plugins/style-match/skills/style-match/scripts/fetch.py list tiktok --limit 3

  # The whole editor, installed from zero into a fresh KIROCUT_HOME with the one bootstrap
  # command, re-run to prove it changes nothing, drifted and repaired (tests/fresh_install.py),
  # then run end to end on a made-up 4 s video: transcribe, capture, face, sound, plan both
  # layouts, stills, render. Windows runs the bootstrap through `py` in PowerShell, as a learner
  # does, and skips the optional matting step there (slow on the runner); smoke still fetches
  # and runs the matting model on every OS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      KIROCUT_WHISPER_MODEL: tiny
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # setup-ffmpeg has no Apple Silicon build (macOS runners are arm64), and its Linux download fails: apt there.
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Fresh KIROCUT_HOME
        run: echo "KIROCUT_HOME=$RUNNER_TEMP/ave-home" >> "$GITHUB_ENV"
      - name: Bootstrap from zero, twice; drift; repair
        if: runner.os != 'Windows'
        run: python tests/fresh_install.py --matte
      - name: Bootstrap from zero, twice; drift; repair (py, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: py -3.12 tests/fresh_install.py
      - name: Doctor
        env:
          ELEVENLABS_API_KEY: placeholder-not-a-real-key-for-ci
        run: |
          python plugins/kirocut/skills/setup/scripts/setup.py doctor
          python plugins/style-match/skills/style-match/scripts/fetch.py doctor
      - name: End to end
        run: python tests/smoke.py
      - name: Recording safety (deny list, blur on a synthetic page)
        run: node tests/test_record.mjs --require-chrome

  # The renderer's look pinned by four stills (tests/golden/linux/; each OS rasterises fonts its own
  # way, so each has its own set, and a Mac or Windows machine checks tests/golden/darwin/ or windows/ locally). On a failure the
  # fresh stills and diffs are uploaded: if the change was meant, download them into
  # tests/golden/linux/ (or run tests/golden.py --update on Linux) and commit.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install (setup skill)
        run: |
          S=plugins/kirocut/skills/setup/scripts/setup.py
          python $S venv
          python $S remotion
      - name: Golden stills
        run: ~/.kirocut/venv/bin/python tests/golden.py --out golden-out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-out
          path: golden-out

  # Evals (tests/run_evals.py): real model calls through the Kiro CLI in headless mode, so manual only
  # and only when the repo has a KIRO_API_KEY secret. Without the secret the job is skipped.
  evals:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Evals
        if: env.KIRO_API_KEY != ''
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          python3 tests/run_evals.py --runs 1
      - if: always() && env.KIRO_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results
